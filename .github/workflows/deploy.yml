name: Deploy Data Engineer Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio website
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Refresh measured baseline and scale benchmark metrics
        run: |
          python3 - <<'PY'
          import csv
          import io
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          headers = {"User-Agent": "portfolio-metrics-build"}
          baseline_base = "https://raw.githubusercontent.com/Vaishnav-K/ai-enhanced-banking-data-platform/main/data/raw"
          baseline = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "source": "measured from public synthetic CSV inputs in the banking data project",
          }

          for key, filename in (("customers", "customers.csv"), ("transactions", "transactions.csv")):
              request = urllib.request.Request(f"{baseline_base}/{filename}", headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = response.read()
              rows = sum(1 for _ in csv.DictReader(io.StringIO(payload.decode("utf-8"))))
              baseline[key] = {"rows": rows, "bytes": len(payload)}

          baseline["total_bytes"] = baseline["customers"]["bytes"] + baseline["transactions"]["bytes"]

          report_url = "https://raw.githubusercontent.com/Vaishnav-K/ai-enhanced-banking-data-platform/main/reports/scale-benchmark-10m-results-public.json"
          request = urllib.request.Request(report_url, headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              benchmark = json.loads(response.read().decode("utf-8"))

          workload = benchmark.get("workload", {})
          execution = benchmark.get("execution", {})
          if benchmark.get("status") != "PASS" or benchmark.get("reconciliation", {}).get("passed") is not True:
              raise SystemExit("Published Spark benchmark report is not PASS.")
          if workload.get("raw_transactions") != 10_000_000 or workload.get("valid_transactions") != 10_000_000:
              raise SystemExit("Published Spark benchmark report does not contain the expected 10M workload.")
          if execution.get("spark_version") != "3.5.7" or execution.get("master") != "local[2]":
              raise SystemExit("Published Spark benchmark execution metadata does not match the reviewed evidence.")

          output = Path("site/data")
          output.mkdir(parents=True, exist_ok=True)
          (output / "pipeline-metrics.json").write_text(json.dumps(baseline, indent=2) + "\n", encoding="utf-8")
          (output / "scale-benchmark-metrics.json").write_text(json.dumps(benchmark, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"baseline": baseline, "scale_benchmark": {
              "customers": workload["customers"],
              "raw_transactions": workload["raw_transactions"],
              "valid_transactions": workload["valid_transactions"],
              "elapsed_seconds": execution["elapsed_seconds"],
              "throughput_raw_transactions_per_second": execution["throughput_raw_transactions_per_second"],
              "reconciliation": benchmark["reconciliation"]["passed"],
          }}, indent=2))
          PY

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
